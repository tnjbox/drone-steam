<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 鷹架｜向量與合力</title><style>body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f4f7fb;color:#172033;line-height:1.75}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dde5ee;border-radius:18px;padding:24px;margin:16px 0}h1,h2{color:#123d63}.flow{font-weight:800;text-align:center;background:#edf9f7;padding:16px;border-radius:12px}.q{background:#fff4cc;padding:14px;border-radius:12px}a{color:#1769aa}</style></head><body><div class="wrap"><a href="../M3.html">← 回 M3 任務</a><h1>概念鷹架｜向量與合力</h1><div class="card"><h2>力不只有大小，還有方向</h2><p>向量可以同時表示「多大」和「往哪裡」。四顆螺旋槳的推力可以視為四個向上的力向量；當機體傾斜後，整體推力也會跟著傾斜。</p><div class="flow">四顆推力相近 → 合力大致向上<br>兩側推力不同 → 機體傾斜 → 合力出現水平分量</div></div><div class="card"><h2>為什麼傾斜後會往前？</h2><p>當機體前傾時，原本主要向上的合力也會一起往前傾，因此可以把它想成同時具有「向上」和「向前」兩個分量。</p><div class="q"><strong>想一想：</strong>若後側推力比前側大，機體先發生什麼變化？接著合力方向又會怎麼改變？</div></div></div></body></html>
