<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 鷹架｜PWM 是什麼？</title><style>body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f4f7fb;color:#172033;line-height:1.75}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dde5ee;border-radius:18px;padding:24px;margin:16px 0}h1,h2{color:#123d63}.bar{height:24px;border-radius:999px;background:linear-gradient(90deg,#1769aa 0 60%,#dfe5ee 60%)}.q{background:#fff4cc;padding:14px;border-radius:12px}a{color:#1769aa}</style></head><body><div class="wrap"><a href="../M2.html">← 回 M2 任務</a><h1>概念鷹架｜PWM 是什麼？</h1><div class="card"><h2>不是只有「開」和「關」</h2><p>PWM 可以把電力輸出切成很快的開、關節奏。開啟時間占得越多，平均輸出效果通常越大。</p><div class="bar"></div><p><strong>例如：</strong>60% 可以想成在很短的循環裡，大約有六成時間輸出、四成時間關閉。實際馬達反應會受到電池、驅動、摩擦與負載影響，所以 PWM 百分比不等於推力百分比。</p></div><div class="card"><h2>M2 為什麼要用 PWM？</h2><p>因為我們想有系統地改變馬達輸出，再觀察推力怎麼變。PWM 是「控制輸出」的方法；推力是我們觀察或量測的結果。</p><div class="q"><strong>關鍵：</strong>PWM 增加，通常代表馬達得到較高的平均驅動，但不表示推力一定線性增加。</div></div></div></body></html>
