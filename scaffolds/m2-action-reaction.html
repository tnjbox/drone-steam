<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 鷹架｜作用力與反作用力</title><style>body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f4f7fb;color:#172033;line-height:1.75}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dde5ee;border-radius:18px;padding:24px;margin:16px 0}h1,h2{color:#123d63}.flow{font-weight:800;text-align:center;background:#edf9f7;padding:16px;border-radius:12px}.q{background:#fff4cc;padding:14px;border-radius:12px}a{color:#1769aa}</style></head><body><div class="wrap"><a href="../M2.html">← 回 M2 任務</a><h1>概念鷹架｜作用力與反作用力</h1><div class="card"><h2>螺旋槳為什麼能產生向上的推力？</h2><div class="flow">螺旋槳把空氣向下推 → 空氣同時把螺旋槳向上推</div><p>這是一組互相作用的力：方向相反、大小相對應，而且分別作用在不同物體上。</p><p>在無人機中，螺旋槳對空氣施力，空氣則對螺旋槳產生反作用，這個向上的作用就是我們在 M2 關心的推力來源之一。</p></div><div class="card"><h2>不要混淆</h2><p>「作用力與反作用力互相抵銷」這句話容易誤解。因為兩個力分別作用在不同物體上，所以不能直接說它們在同一物體上互相抵銷。</p><div class="q"><strong>想一想：</strong>如果螺旋槳把更多空氣往下推，向上的反作用會有什麼變化？</div></div></div></body></html>
