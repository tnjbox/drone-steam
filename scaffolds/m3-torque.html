<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 鷹架｜轉矩與反扭矩</title><style>body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f4f7fb;color:#172033;line-height:1.75}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dde5ee;border-radius:18px;padding:24px;margin:16px 0}h1,h2{color:#123d63}.flow{font-weight:800;text-align:center;background:#edf9f7;padding:16px;border-radius:12px}.q{background:#fff4cc;padding:14px;border-radius:12px}a{color:#1769aa}</style></head><body><div class="wrap"><a href="../M3.html">← 回 M3 任務</a><h1>進階鷹架｜轉矩與反扭矩</h1><div class="card"><h2>為什麼螺旋槳轉，機體也會想往反方向轉？</h2><p>馬達帶動螺旋槳旋轉時，機體會受到相反方向的旋轉作用。這種讓物體產生旋轉趨勢的作用可用「轉矩」來描述。</p><div class="flow">螺旋槳往一個方向轉 → 機體受到相反方向的反扭矩</div><p>因此四軸通常安排兩顆朝一個方向轉、另外兩顆朝相反方向轉，讓兩組旋轉作用在懸停時大致互相平衡。</p></div><div class="card"><h2>那要怎麼原地左旋或右旋？</h2><p>如果正轉組與反轉組的輸出不再一樣，兩邊的反扭矩就不再完全平衡，機體會出現偏航旋轉。</p><div class="q"><strong>注意：</strong>M3 只需要先理解「旋轉作用會互相平衡或失衡」。正式的轉矩公式與力臂計算不是本關必要條件。</div></div></div></body></html>
