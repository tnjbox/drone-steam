<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M5 智慧控制｜回授模擬器</title><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#617083;--line:#dde5ee;--blue:#123d63;--blue2:#1769aa;--teal:#0f8b8d;--green:#2b8a5a;--yellow:#fff4cc;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}.wrap{max-width:1120px;margin:auto;padding:24px}a{color:var(--blue2)}h1,h2{color:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 24px #1423370d}.modebar,.buttons{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:800;background:#eaf1f6;color:#194f73;cursor:pointer}.btn.active{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.red{background:#fff0ef;color:var(--red);border:1px solid #efc5c1}.simgrid{display:grid;grid-template-columns:minmax(390px,1.02fr) minmax(320px,.98fr);gap:20px}.stage{height:430px;border:1px solid #d8e4ef;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#eaf6ff 0 78%,#efe9dd 78%)}.target-line{position:absolute;left:0;right:0;border-top:3px dashed #0f8b8d;transition:.25s}.target-label{position:absolute;right:12px;transform:translateY(-100%);color:#0f8b8d;font-weight:800;font-size:.9rem}.drone{position:absolute;left:50%;transform:translate(-50%,-50%);width:175px;height:90px;transition:.4s ease}.arm{position:absolute;left:50%;top:50%;width:145px;height:12px;background:#4c6275;border-radius:999px;transform:translate(-50%,-50%)}.arm.a{transform:translate(-50%,-50%) rotate(35deg)}.arm.b{transform:translate(-50%,-50%) rotate(-35deg)}.body{position:absolute;left:50%;top:50%;width:64px;height:46px;background:#173f5f;border-radius:14px;transform:translate(-50%,-50%)}.rotor{position:absolute;width:48px;height:48px;border:5px solid #263746;border-radius:50%;background:#fff}.r1{left:5px;top:3px}.r2{right:5px;top:3px}.r3{left:5px;bottom:3px}.r4{right:5px;bottom:3px}.sensor{position:absolute;left:50%;top:69%;width:18px;height:10px;background:#0f8b8d;border-radius:4px;transform:translateX(-50%)}.beam{position:absolute;left:50%;width:4px;background:#57b7ff77;transform:translateX(-50%);border-radius:999px}.panel{display:grid;gap:12px}.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe}.big{font-size:1.7rem;font-weight:900;color:var(--blue2)}.error.pos{color:var(--green)}.error.neg{color:var(--red)}.error.zero{color:var(--muted)}.result{background:#edf9f7;border-left:5px solid var(--teal);padding:15px 17px;border-radius:12px}.chain{background:var(--yellow);padding:13px 15px;border-radius:12px;font-weight:800}.history{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:12px}.history table{width:100%;border-collapse:collapse;font-size:.92rem}.history th,.history td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.history th{background:#eef5fa;position:sticky;top:0}.hidden{display:none}.note{color:var(--muted)}input[type=range]{width:100%}@media(max-width:820px){.simgrid{grid-template-columns:1fr}.stage{height:400px}.metric{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="../index.html">← 回課程首頁</a><h1>M5｜智慧控制回授模擬器</h1><p>先自己當控制器，再讓系統自動回授。觀察「目標值、感測值、誤差、修正、再感測」如何形成閉迴路。</p><div class="card"><div class="modebar"><button id="manualBtn" class="btn active" onclick="setMode('manual')">人工控制</button><button id="autoBtn" class="btn" onclick="setMode('auto')">自動回授</button></div></div><div class="card"><div class="simgrid"><div class="stage"><div id="targetLine" class="target-line"></div><div id="targetLabel" class="target-label"></div><div id="beam" class="beam"></div><div id="drone" class="drone"><div class="arm a"></div><div class="arm b"></div><div class="body"></div><div class="rotor r1"></div><div class="rotor r2"></div><div class="rotor r3"></div><div class="rotor r4"></div><div class="sensor"></div></div></div><div class="panel"><h2 style="margin:0">控制狀態</h2><label><strong>目標高度</strong> <span class="big"><span id="targetVal">50</span> cm</span></label><input id="target" type="range" min="20" max="90" step="5" value="50"><label><strong>目前高度</strong> <span class="big"><span id="currentVal">35</span> cm</span></label><input id="current" type="range" min="10" max="100" step="5" value="35"><div class="metric"><div class="box"><strong>目標值 Setpoint</strong><div><span id="targetBox" class="big">50</span> cm</div></div><div class="box"><strong>感測值 Measured</strong><div><span id="currentBox" class="big">35</span> cm</div></div><div class="box"><strong>誤差 Error</strong><div><span id="errorBox" class="big error pos">+15</span> cm</div></div><div class="box"><strong>控制方向</strong><div id="controlBox" class="big">增加輸出</div></div></div><div id="manualControls" class="buttons"><button class="btn green" onclick="manualStep(1)">增加輸出</button><button class="btn" onclick="manualStep(0)">保持</button><button class="btn red" onclick="manualStep(-1)">降低輸出</button></div><div id="autoControls" class="buttons hidden"><button id="autoStart" class="btn green" onclick="toggleAuto()">開始自動回授</button></div><div class="buttons"><button class="btn" onclick="disturb(-15)">模擬向下擾動</button><button class="btn" onclick="disturb(15)">模擬向上擾動</button><button class="btn" onclick="resetSim()">重設</button></div><div id="result" class="result"></div><div class="chain">目標值 → 感測值 → 比較誤差 → 修正 → 再感測</div></div></div></div><div class="card"><h2>每一步發生了什麼？</h2><div class="history"><table><thead><tr><th>步驟</th><th>目前高度</th><th>誤差</th><th>控制動作</th></tr></thead><tbody id="historyBody"></tbody></table></div></div><div class="card"><h2>系統界線</h2><p><strong>感測器提供目前高度；控制器負責比較目標與目前值，再決定怎麼修正。</strong></p><p class="note">這是概念模型，不是 #1413 真實 PID 參數，也不表示 PWM 與高度變化具有精密線性關係。</p></div></div><script>const target=document.getElementById('target'),current=document.getElementById('current');let mode='manual',timer=null,stepNo=0;function clamp(v){return Math.max(10,Math.min(100,v))}function err(){return +target.value-(+current.value)}function actionFor(e){if(Math.abs(e)<=2)return '保持';return e>0?'增加輸出':'降低輸出'}function yFromHeight(h){return 355-h*3.0}function draw(){const t=+target.value,c=+current.value,e=t-c;targetVal.textContent=t;currentVal.textContent=c;targetBox.textContent=t;currentBox.textContent=c;errorBox.textContent=(e>0?'+':'')+e;errorBox.className='big error '+(Math.abs(e)<=2?'zero':e>0?'pos':'neg');controlBox.textContent=actionFor(e);const ty=yFromHeight(t),cy=yFromHeight(c);targetLine.style.top=ty+'px';targetLabel.style.top=ty+'px';targetLabel.textContent='目標 '+t+' cm';drone.style.top=cy+'px';beam.style.top=(cy+25)+'px';beam.style.height=Math.max(8,405-(cy+25))+'px';result.innerHTML=Math.abs(e)<=2?'<strong>接近目標：</strong>目前誤差很小，可以先保持。':e>0?'<strong>目前太低：</strong>需要讓控制輸出朝增加高度的方向修正。':'<strong>目前太高：</strong>需要讓控制輸出朝降低高度的方向修正。'}function addHistory(action){const e=err();stepNo++;const tr=document.createElement('tr');tr.innerHTML=`<td>${stepNo}</td><td>${current.value} cm</td><td>${e>0?'+':''}${e} cm</td><td>${action}</td>`;historyBody.prepend(tr)}function manualStep(dir){let c=+current.value;if(dir>0)c+=8;if(dir<0)c-=8;current.value=clamp(c);draw();addHistory(dir>0?'增加輸出':dir<0?'降低輸出':'保持')}function autoStep(){const e=err();let action='保持';if(Math.abs(e)>2){const delta=Math.max(2,Math.min(8,Math.abs(e)*0.45));current.value=clamp(+current.value+(e>0?delta:-delta));action=e>0?'增加輸出':'降低輸出'}draw();addHistory(action);if(Math.abs(err())<=2){clearInterval(timer);timer=null;autoStart.textContent='開始自動回授'}}function toggleAuto(){if(timer){clearInterval(timer);timer=null;autoStart.textContent='開始自動回授';return}autoStart.textContent='暫停';autoStep();timer=setInterval(autoStep,750)}function disturb(d){current.value=clamp(+current.value+d);draw();addHistory(d>0?'外界干擾：高度上升':'外界干擾：高度下降')}function setMode(m){mode=m;manualBtn.classList.toggle('active',m==='manual');autoBtn.classList.toggle('active',m==='auto');manualControls.classList.toggle('hidden',m!=='manual');autoControls.classList.toggle('hidden',m!=='auto');if(m==='manual'&&timer){clearInterval(timer);timer=null;autoStart.textContent='開始自動回授'}}function resetSim(){if(timer){clearInterval(timer);timer=null}target.value=50;current.value=35;stepNo=0;historyBody.innerHTML='';autoStart.textContent='開始自動回授';draw()}target.addEventListener('input',draw);current.addEventListener('input',draw);draw();</script></body></html>
