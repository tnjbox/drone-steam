<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 推力模擬器</title><style>body{margin:0;font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:22px;margin-bottom:18px}h1,h2{color:#123d63}.sim{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.stage{height:340px;border-radius:18px;background:linear-gradient(#eef7ff,#fff);position:relative;overflow:hidden;border:1px solid #d8e4ef}.motor{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:84px;height:44px;background:#56606c;border-radius:12px}.prop{position:absolute;left:50%;top:92px;width:190px;height:18px;background:#26384a;border-radius:999px;transform:translateX(-50%);transform-origin:center;animation:spin 1s linear infinite}.hub{position:absolute;left:50%;top:86px;width:32px;height:32px;background:#101820;border-radius:50%;transform:translateX(-50%)}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}.air{position:absolute;left:50%;top:180px;transform:translateX(-50%);display:flex;gap:18px}.air span{width:8px;height:70px;background:#39a0ed;border-radius:999px;position:relative;opacity:.35}.air span:after{content:"";position:absolute;left:-6px;bottom:-1px;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #39a0ed}.thrust{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:10px;height:62px;background:#ff8a3d;border-radius:999px}.thrust:before{content:"";position:absolute;left:-8px;top:-14px;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:18px solid #ff8a3d}.thrust-label{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-weight:800;color:#d65f16}.controls label{font-weight:800}.value{font-size:2rem;color:#1769aa;font-weight:900}.chain{padding:14px;background:#edf9f7;border-radius:12px;text-align:center;font-weight:800}.chart{height:210px;border-left:2px solid #6b7785;border-bottom:2px solid #6b7785;position:relative;margin:28px 20px 10px}.dot{position:absolute;width:12px;height:12px;background:#1769aa;border-radius:50%;transform:translate(-50%,50%)}.bar{position:absolute;left:0;bottom:0;height:4px;background:#1769aa;transform-origin:left center}.note{color:#617083;font-size:.95rem}@media(max-width:760px){.sim{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="../M2.html">← 回 M2 任務頁</a><h1>M2 虛擬推力模擬器</h1><p>拖曳馬達輸出，觀察螺旋槳、氣流與推力的相對變化。此頁為概念模擬，不代表真實 #1413 馬達的校正數值。</p><div class="card sim"><div class="stage"><div class="thrust-label">向上推力</div><div id="thrust" class="thrust"></div><div id="prop" class="prop"></div><div class="hub"></div><div class="motor"></div><div class="air" id="air"><span></span><span></span><span></span><span></span><span></span></div></div><div class="controls"><label for="pwm">馬達輸出</label><input id="pwm" type="range" min="0" max="100" step="5" value="50" style="width:100%"><div class="value"><span id="pwmv">50</span>%</div><p>模擬相對推力：<strong><span id="tv">25</span></strong></p><div class="chain">電能 → 馬達旋轉 → 螺旋槳推動空氣 → 推力</div><p class="note">概念模型採簡化的非線性關係，目的是讓學生觀察趨勢，不作為真實推力預測。</p></div></div><div class="card"><h2>輸出與相對推力趨勢</h2><div id="chart" class="chart"></div></div></div><script>const p=document.getElementById('pwm'),pv=document.getElementById('pwmv'),tv=document.getElementById('tv'),prop=document.getElementById('prop'),air=document.getElementById('air'),th=document.getElementById('thrust'),chart=document.getElementById('chart');function thrust(x){return Math.round(x*x/100)}function draw(){const x=+p.value,y=thrust(x);pv.textContent=x;tv.textContent=y;prop.style.animationDuration=(1.2-Math.max(x,5)/100).toFixed(2)+'s';[...air.children].forEach(s=>{s.style.height=(30+y*.7)+'px';s.style.opacity=.2+x/125});th.style.height=(30+y*.7)+'px';chart.innerHTML='';let prev=null;for(let i=0;i<=100;i+=10){const yy=thrust(i),cx=i/100*chart.clientWidth,cy=yy/100*chart.clientHeight;const d=document.createElement('div');d.className='dot';d.style.left=cx+'px';d.style.bottom=cy+'px';chart.appendChild(d);if(prev){const dx=cx-prev.x,dy=cy-prev.y,len=Math.hypot(dx,dy),ang=Math.atan2(-dy,dx)*180/Math.PI;const b=document.createElement('div');b.className='bar';b.style.width=len+'px';b.style.left=prev.x+'px';b.style.bottom=prev.y+'px';b.style.transform='rotate('+ang+'deg)';chart.appendChild(b)}prev={x:cx,y:cy}}}p.addEventListener('input',draw);addEventListener('resize',draw);draw();</script></body></html>
